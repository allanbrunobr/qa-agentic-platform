name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/persona-qa-dashboard/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install runtime template dependencies
        run: npm run setup:runtime
      - name: Lint
        run: npm run lint
      - name: Dependency audit (high and critical)
        run: npm run audit:deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and route tests
        run: npm test
      - name: Release gate
        run: npm run verify:release

  e2e:
    name: End-to-end quick start (storefront, real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/persona-qa-dashboard/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install runtime template dependencies
        run: npm run setup:runtime
      - name: Install Chromium and system dependencies
        working-directory: templates/persona-qa-dashboard
        run: npx playwright install --with-deps chromium
      - name: Run quick start end to end
        run: npm run test:e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
